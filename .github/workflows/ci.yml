# Generated for the reposplit micro-repo layout.
# Steps are emitted only for tooling this repo actually contains.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install (packages/media_center)
        working-directory: packages/media_center
        run: npm install
      - name: Install (packages/stream_cast)
        working-directory: packages/stream_cast
        run: npm install
      - name: Install (streaming/admin)
        working-directory: streaming/admin
        run: npm install
      - name: lint (streaming/admin)
        working-directory: streaming/admin
        run: npm run lint
      - name: build (streaming/admin)
        working-directory: streaming/admin
        run: npm run build
  cpp-frontends-discjockey:
    name: C++ frontends/discjockey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Conan
        run: pip install 'conan>=2.1'
      - name: Cache Conan
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-media_center-frontends-discjockey-${{ runner.os }}-${{ hashFiles('frontends/discjockey/conanfile.txt') }}
          restore-keys: conan-media_center-frontends-discjockey-${{ runner.os }}-
      - name: Conan install
        working-directory: frontends/discjockey
        run: |
          conan profile detect --force
          conan install . --output-folder=_build --build=missing \
            --settings=build_type=Release
      - name: Configure
        working-directory: frontends/discjockey
        run: |
          cmake -S . -B _build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/_build/conan_toolchain.cmake"
      - name: Build
        working-directory: frontends/discjockey
        run: cmake --build _build --parallel "$(nproc)"
  cpp-services-radio:
    name: C++ services/radio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Conan
        run: pip install 'conan>=2.1'
      - name: Cache Conan
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-media_center-services-radio-${{ runner.os }}-${{ hashFiles('services/radio/conanfile.txt') }}
          restore-keys: conan-media_center-services-radio-${{ runner.os }}-
      - name: Conan install
        working-directory: services/radio
        run: |
          conan profile detect --force
          conan install . --output-folder=_build --build=missing \
            --settings=build_type=Release
      - name: Configure
        working-directory: services/radio
        run: |
          cmake -S . -B _build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/_build/conan_toolchain.cmake"
      - name: Build
        working-directory: services/radio
        run: cmake --build _build --parallel "$(nproc)"
